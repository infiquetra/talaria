[package]
name = "talaria-workflow"
description = "Detached workflow execution, journaling, scheduling and budgets."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = []
mock = []
fake-gateway = []
hermes-live = []

[dependencies]
toml.workspace = true
tracing-subscriber.workspace = true
chrono.workspace = true
talaria-core.workspace = true
tempfile.workspace = true
futures-util.workspace = true
hermes-client.workspace = true
hermes-contract.workspace = true
jsonschema.workspace = true
tracing.workspace = true
rquickjs.workspace = true
tokio.workspace = true
tokio-util.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
hex.workspace = true
thiserror.workspace = true

getrandom.workspace = true

[dev-dependencies]
talaria-workflow = { path = ".", features = ["mock", "fake-gateway"] }
hermes-client.workspace = true
tokio = { workspace = true, features = ["test-util"] }
proptest.workspace = true
toml.workspace = true
tempfile.workspace = true

[[example]]
name = "dry_run"
required-features = ["mock"]

[[bench]]
name = "workflow_engine"
harness = false
required-features = ["mock"]

[[example]]
name = "journal_resume"
required-features = ["mock", "fake-gateway"]

[lints]
workspace = true

[[example]]
name = "roster"
required-features = ["hermes-live"]

[[example]]
name = "staffed_run"
required-features = ["hermes-live"]

[[example]]
name = "progress_dump"

[[example]]
name = "worktree_agent"
required-features = ["mock"]

# Settings for `cargo nextest run` and `cargo llvm-cov nextest`.

[profile.default]
# A failing test fails the run. Nothing is retried, so a flaky test stays visible.
retries = 0
# Report every failure in one run instead of stopping at the first.
fail-fast = false

[test-groups]
# trybuild builds a scratch crate in one directory under the target directory. cargo-nextest
# runs each test in its own process, and two trybuild processes there break each other's build.
trybuild = { max-threads = 1 }

[[profile.default.overrides]]
filter = 'package(hermes-client) & binary(native_method)'
test-group = 'trybuild'

# These tests assert on elapsed time, or count the connections a local server receives. Next
# to dozens of other tests they fail now and then, so each one runs with nothing beside it.
# They also run last. A test that needs every slot waits until all running tests finish, so
# in the middle of a run it would hold everything up for as long as the slowest test. Right
# after the build they have failed even with nothing beside them, so they do not run first.
# Every file name is matched as a test binary and as a module path, so a test keeps this
# setting if its file later becomes a module of a larger test binary.
[[profile.default.overrides]]
filter = """
  (package(talaria-app) & (
    binary(acp_wire) | test(/acp_wire::/)
    | binary(voice_client_transport) | test(/voice_client_transport::/)
  ))
  | (package(hermes-client) & (
    binary(audio_relay) | test(/audio_relay::/) | test(/provider_counts_concurrency/)
  ))
  | (package(talaria-cli) & (binary(bg_cmd) | test(/bg_cmd::/)))
  | (package(talaria-workflow) & test(/runaway_loop_is_stopped/))
"""
threads-required = "num-cpus"
priority = -100

[project]
name = "talaria"
# Read from talaria/__init__.py rather than written here. Two literals that
# must agree drift the moment somebody bumps one of them, and the drift is
# silent: the wheel says one version and `talaria --version` says another.
# One source of truth by construction beats a test asserting two agree.
dynamic = ["version"]
description = "Hermes-native terminal UI client"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "MIT" }
dependencies = [
    "pygments>=2.20,<3",
    "textual>=8.2.8,<9",
    "websockets>=13,<16",
]

[project.scripts]
talaria = "talaria.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "talaria/__init__.py"

# An allow-list, not a deny-list. Hatchling's default source-distribution
# selection is "everything in the project directory that version control does
# not ignore", which sweeps in *untracked* working-tree files: building v0.1.0
# locally put `.claude/settings.local.json` — never committed, never ignored —
# into the tarball. It was harmless, but the shape is not: what a release
# artifact contains would depend on what happened to be lying in the builder's
# directory that day, and this repository is public. Naming what ships cannot
# leak a file nobody thought of.
[tool.hatch.build.targets.sdist]
include = [
    "/talaria",
    "/README.md",
    "/LICENSE",
]

[tool.hatch.build.targets.wheel]
packages = ["talaria"]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.3",
    "bandit>=1.7",
    "pytest-asyncio>=0.24",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
# Tests are type-checked too: a test asserting against a type the
# implementation no longer returns is a defect strict mode can catch.
files = ["talaria", "tests", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests", "scripts/acceptance"]
# Strict mode, not auto: an async test without the marker should fail loudly
# rather than be silently collected and skipped, which is the failure mode auto
# mode is designed to hide.
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"

[tool.bandit]
exclude_dirs = ["tests"]

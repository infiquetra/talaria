# cargo-deny 0.20.2 advisory policy. Vulnerabilities are always errors.
# The three ignores are unmaintained advisories with no patched upgrade.
[advisories]
version = 2
yanked = "deny"
unmaintained = "all"
unsound = "all"
ignore = [
    { id = "RUSTSEC-2025-0141", reason = "bincode 1.3.3 is unmaintained and arrives only through syntect 5.3.0. Revisit when syntect drops bincode 1.x." },
    { id = "RUSTSEC-2025-0134", reason = "rustls-pemfile 2.2.0 is unmaintained and is a dev-dependency of hermes-client test fixtures. Revisit when those tests migrate to rustls_pki_types::pem::PemObject." },
    { id = "RUSTSEC-2026-0543", reason = "chrono 0.4.45 is unmaintained. Migrating date and time handling to jiff or time is out of scope for this gate. Revisit on a dedicated migration issue." },
]

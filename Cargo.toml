[workspace]
resolver = "3"
members = [
    "crates/hermes-contract",
    "crates/hermes-client",
    "crates/talaria-core",
    "crates/talaria-app",
    "crates/talaria-tui",
    "crates/talaria-workflow",
    "crates/talaria-cli",
    "tools/bench",
    "tools/patterns-check",
    "tools/record-fixture",
    "tools/smoke",
]
# Reference slices remain standalone packages when Cargo runs inside the handoff.
exclude = ["docs"]

[workspace.package]
version = "0.7.0-dev"
edition = "2024"
rust-version = "1.98.1"
license = "MIT"
repository = "https://github.com/infiquetra/talaria"
publish = false

[workspace.dependencies]
ratatui = { version = "=0.30.2", features = ["scrolling-regions"] }
crossterm = { version = "=0.29.0", features = ["event-stream"] }
tokio = { version = "=1.54.1", features = ["full"] }
tokio-tungstenite = "=0.26.2"
futures-util = "=0.3.34"
fastrand = "=2.5.0"
serde = { version = "=1.0.229", features = ["derive"] }
signal-hook = "=0.4.5"
serde_json = "=1.0.154"
regress = "=0.10.3"
proptest = "=1.11.0"
pulldown-cmark = { version = "=0.13.4", default-features = false }
zeroize = "=1.9.1"
rustix = { version = "=1.1.5", features = ["fs", "process", "termios"] }
shell-words = "=1.1.0"
unicode-segmentation = "=1.13.3"
unicode-width = "=0.2.2"
vt100 = "=0.16.2"
alacritty_terminal = "=0.26.0"
vte = { version = "=0.15.0", features = ["ansi"] }
shlex = "=2.0.1"
sha2 = "=0.11.0"
static_assertions = "=1.1.0"
syntect = { version = "=5.3.0", default-features = false, features = ["parsing", "default-syntaxes", "regex-fancy"] }
tempfile = "=3.27.0"
thiserror = "=2.0.21"
http = "=1.5.0"
url = "=2.5.8"
regex = "=1.13.1"
gethostname = "=1.1.0"
getrandom = "=0.3.4"
time = { version = "=0.3.55", features = ["formatting"] }
clap = { version = "=4.6.7", features = ["derive"] }
rand = "=0.10.3"
portable-pty = "=0.9.0"
toml = "=1.1.8+spec-1.1.0"
hermes-contract = { path = "crates/hermes-contract" }
hermes-client = { path = "crates/hermes-client" }
talaria-core = { path = "crates/talaria-core" }
talaria-app = { path = "crates/talaria-app" }
talaria-tui = { path = "crates/talaria-tui" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

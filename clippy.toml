# Interfaces the patterns guide forbids. See docs/agents/patterns.md, "Interfaces not to use".
# Clippy only warns about a misspelled path and -D warnings does not fail on it:
# tools/patterns-check tests this list.
disallowed-methods = [
  { path = "ratatui::Terminal::insert_before", reason = "commit history in the terminal module by newline scrolling; see docs/agents/patterns.md" },
  { path = "ratatui::Terminal::get_cursor_position", reason = "cursor queries race the key reader; see docs/agents/patterns.md" },
  { path = "ratatui::crossterm::cursor::position", reason = "cursor queries race the key reader; see docs/agents/patterns.md" },
  { path = "ratatui::init", reason = "enters the alternate screen; the terminal module owns setup; see docs/agents/patterns.md" },
  { path = "ratatui::try_init", reason = "enters the alternate screen; the terminal module owns setup; see docs/agents/patterns.md" },
  { path = "ratatui::init_with_options", reason = "the terminal module owns setup; see docs/agents/patterns.md" },
  { path = "ratatui::try_init_with_options", reason = "the terminal module owns setup; see docs/agents/patterns.md" },
  { path = "ratatui::run", reason = "the terminal module owns setup; see docs/agents/patterns.md" },
  { path = "ratatui::restore", reason = "the terminal module owns restore; see docs/agents/patterns.md" },
  { path = "ratatui::try_restore", reason = "the terminal module owns restore; see docs/agents/patterns.md" },
]
disallowed-types = [
  { path = "ratatui::DefaultTerminal", reason = "the terminal module owns setup; see docs/agents/patterns.md" },
]

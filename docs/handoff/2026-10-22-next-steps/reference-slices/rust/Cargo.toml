[package]
name = "slice"
version = "0.1.0"
edition = "2021"

[dependencies]
ratatui = { version = "0.30", features = ["scrolling-regions"] }
crossterm = { version = "0.29", features = ["event-stream"] }
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.26"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tungstenite = "0.26"
unicode-width = "0.2"

[profile.release]
opt-level = 3

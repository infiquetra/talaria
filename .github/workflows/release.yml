name: Release

# Check the tagged tree, then publish verified archives and propose tap updates.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release, e.g. v0.7.0"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: macos-15
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Resolve the tag being released
        id: resolve
        shell: bash
        # Two separate defences, because this value later reaches `ref:` on
        # actions/checkout and that is the one place a bad value would be acted
        # on rather than merely printed.
        #
        # First, the tag reaches the shell through the environment rather than
        # through `${{ }}` interpolation, so it cannot become shell syntax here.
        # Second, it must match a whole-string regex before it is allowed out of
        # this step. `[[ =~ ]]` is used rather than a `case` glob deliberately:
        # a glob like v[0-9]*.[0-9]*.[0-9]* looks strict and is not, because `*`
        # matches spaces, semicolons and newlines — so `v1.2.3; rm -rf /` passes
        # it, as does a value carrying a second line that would forge an extra
        # GITHUB_OUTPUT entry. The regex below admits digits, dots and a
        # conventional pre-release suffix, and nothing else.
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            tag="$INPUT_TAG"
          else
            tag="$REF_NAME"
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::'$tag' is not a release tag. Expected vMAJOR.MINOR.PATCH with an optional pre-release suffix, e.g. v0.1.0 or v0.1.0-rc1."
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [[ "$tag" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out the tagged tree
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ steps.resolve.outputs.tag }}
          fetch-depth: 0

      - name: Install the pinned toolchain
        run: |
          rustup toolchain install
          rustup show active-toolchain
      - name: The tag agrees with the workspace version
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          expected="$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "talaria-cli") | .version')"
          test -n "$expected" || { echo "::error::Could not read the talaria-cli version."; exit 1; }
          base="${TAG#v}"; base="${base%%-*}"
          want="${expected%%-*}"
          if [ "$base" != "$want" ]; then
            echo "::error::Tag $TAG releases '$base', but the workspace declares '$expected'."
            exit 1
          fi
      - name: Restore disposable Rust caches
        # Branch-context dispatches use the full-work fallback, without loading tag-owned helpers.
        # Tag contexts must match the resolved checkout; older tags may lack this optional action.
        if: github.ref == format('refs/tags/{0}', steps.resolve.outputs.tag) && hashFiles('.github/actions/rust-cache/action.yml') != ''
        continue-on-error: true
        uses: ./.github/actions/rust-cache
        with:
          role: release-debug
      - name: Project check
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test --workspace
      - name: Check the release version
        id: version
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          workspace="$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "talaria-cli") | .version')"
          version="$(python3 -I tools/package/package.py version-gate --tag "$TAG" \
            --workspace-version "$workspace")"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    needs: check
    uses: ./.github/workflows/package-build.yml
    with:
      ref: ${{ needs.check.outputs.tag }}
      version: ${{ needs.check.outputs.version }}

  publish:
    needs: [check, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.check.outputs.tag }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: talaria-*
          path: dist
          merge-multiple: true
      - name: Create and verify checksums
        run: |
          python3 -I tools/package/package.py checksums dist
          (cd dist && sha256sum -c SHA256SUMS)
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/talaria-*.tar.gz
      - name: Create or complete the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.check.outputs.tag }}
          PRERELEASE: ${{ needs.check.outputs.prerelease }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            mkdir existing
            count="$(gh release view "$TAG" --json assets --jq '.assets | length')"
            if [ "$count" -gt 0 ]; then
              gh release download "$TAG" --dir existing
            fi
            names="$(python3 -I tools/package/package.py plan-upload dist/SHA256SUMS existing)"
            for name in $names; do gh release upload "$TAG" "dist/$name"; done
          else
            args=(release create "$TAG" --verify-tag --title "Talaria $TAG" --generate-notes)
            if [ "$PRERELEASE" = "true" ]; then args+=(--prerelease); fi
            gh "${args[@]}" dist/talaria-*.tar.gz dist/SHA256SUMS
          fi

  tap:
    needs: [check, publish]
    if: needs.check.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - name: Is the tap token set
        id: token
        run: |
          if [ -z "$HOMEBREW_TAP_TOKEN" ]; then
            echo "::warning::HOMEBREW_TAP_TOKEN is not set; the Homebrew tap was not updated"
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.token.outputs.present == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.check.outputs.tag }}
          path: talaria
      - if: steps.token.outputs.present == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: infiquetra/homebrew-talaria
          token: ${{ env.HOMEBREW_TAP_TOKEN }}
          path: tap
      - name: Fetch the published checksums
        if: steps.token.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.check.outputs.tag }}
        run: gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern SHA256SUMS --dir sums
      - name: Open the tap pull request
        if: steps.token.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ env.HOMEBREW_TAP_TOKEN }}
          TAG: ${{ needs.check.outputs.tag }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          branch="talaria-$VERSION"
          cd tap
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            echo "::error::Branch $branch already exists in the tap; not overwriting it."
            exit 1
          else
            status=$?
            if [ "$status" -ne 2 ]; then
              echo "::error::Could not check the tap branch."
              exit "$status"
            fi
          fi
          open="$(gh pr list --repo infiquetra/homebrew-talaria --head "$branch" --state open \
            --json number --jq 'length')"
          if [ "$open" != "0" ]; then
            echo "::error::An open pull request for $branch already exists in the tap."
            exit 1
          fi
          mkdir -p Formula
          python3 -I ../talaria/tools/package/package.py formula --version "$VERSION" \
            --sums ../sums/SHA256SUMS > Formula/talaria.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add Formula/talaria.rb
          git commit -m "talaria $VERSION"
          git push origin "$branch"
          gh pr create --repo infiquetra/homebrew-talaria --head "$branch" --base main \
            --title "talaria $VERSION" \
            --body "Release: https://github.com/infiquetra/talaria/releases/tag/$TAG"

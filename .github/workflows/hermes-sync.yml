name: Hermes sync

on:
  workflow_dispatch:
  schedule:
    - cron: "23 7 * * *"

permissions:
  contents: write
  issues: write

jobs:
  hermes-sync:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: compare
        id: compare
        shell: bash
        run: |
          tag="$(python3 - <<'PY'
          import importlib.util
          spec = importlib.util.spec_from_file_location("contract_gen", "tools/contract-gen/contract_gen.py")
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          newest, _ = module.resolve_tag("latest")
          pinned, _ = module.read_pin()
          if module.compare_versions(newest, pinned) > 0:
              print(newest)
          PY
          )"
          if [ -z "$tag" ]; then
            echo 'proceed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          issues="$(gh issue list --state open --search "in:title \"Hermes $tag\"" --limit 100 --json title,number)"
          matched="$(printf '%s' "$issues" | python3 -c 'import json,sys; tag=sys.argv[1]; titles={"Hermes " + tag + " is ready to sync", "Hermes " + tag + " needs a manual sync"}; print("yes" if any(i["title"] in titles for i in json.load(sys.stdin)) else "no")' "$tag")"
          rc=0
          git ls-remote --exit-code --heads origin "chore/hermes-sync-$tag" || rc=$?
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 2 ]; then
            exit "$rc"
          fi
          if [ "$rc" -eq 2 ] && [ "$matched" = no ]; then
            echo 'proceed=true' >> "$GITHUB_OUTPUT"
            printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"
          else
            echo 'proceed=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Install toolchain
        if: steps.compare.outputs.proceed == 'true'
        run: rustup toolchain install
      - name: Restore contract cache
        if: steps.compare.outputs.proceed == 'true'
        continue-on-error: true
        uses: ./.github/actions/rust-cache
        with:
          role: contract-check-debug
      - name: Restore typify cache
        if: steps.compare.outputs.proceed == 'true'
        continue-on-error: true
        uses: ./.github/actions/rust-cache
        with:
          role: typify-install-release
      - name: Install cargo-typify
        if: steps.compare.outputs.proceed == 'true'
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target/ci-tools/cargo-typify-0.8.0
          CARGO_BUILD_BUILD_DIR: ${{ github.workspace }}/target/ci-tools/cargo-typify-0.8.0
        run: cargo install cargo-typify --version 0.8.0 --locked
      - name: bump
        id: bump
        if: steps.compare.outputs.proceed == 'true'
        env:
          SYNC_TAG: ${{ steps.compare.outputs.tag }}
        run: python3 tools/contract-gen/contract_gen.py bump --tag "$SYNC_TAG" > "$RUNNER_TEMP/hermes-sync-bump.txt" 2> "$RUNNER_TEMP/hermes-sync-bump-err.txt"
      - name: test
        id: test
        if: steps.compare.outputs.proceed == 'true'
        run: cargo test --workspace > "$RUNNER_TEMP/hermes-sync-test.txt" 2>&1
      - name: pull
        id: pull
        if: steps.compare.outputs.proceed == 'true'
        env:
          SYNC_TAG: ${{ steps.compare.outputs.tag }}
        shell: bash
        run: |
          tag="$SYNC_TAG"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "chore/hermes-sync-$tag"
          git add -- crates/hermes-contract/PINNED crates/hermes-contract/vendor/gateway-contract.openrpc.json crates/hermes-contract/vendor/gateway-contract.openrpc.json.sha256 crates/hermes-contract/vendor/LICENSE.hermes crates/hermes-contract/src/generated/ crates/hermes-contract/compat.toml docs/compatibility.md README.md
          git commit -m "chore(contract): sync with Hermes $tag"
          git push origin HEAD
          {
            printf 'both commands passed\n\n'
            printf 'https://github.com/infiquetra/talaria/compare/main...chore/hermes-sync-%s?quick_pull=1&title=Sync+with+Hermes+%s\n' "$tag" "$tag"
            cat "$RUNNER_TEMP/hermes-sync-bump.txt"
            printf '\n%s\n' 'Write `Closes` and this issue'"'"'s number in the pull request description.'
          } > "$RUNNER_TEMP/hermes-sync-ready.txt"
          gh issue create --title "Hermes $tag is ready to sync" --body-file "$RUNNER_TEMP/hermes-sync-ready.txt"
      - name: issue
        id: issue
        if: failure() && steps.compare.outputs.proceed == 'true' && (steps.bump.outcome == 'failure' || steps.test.outcome == 'failure')
        env:
          SYNC_TAG: ${{ steps.compare.outputs.tag }}
          BUMP_OUTCOME: ${{ steps.bump.outcome }}
        shell: bash
        run: |
          tag="$SYNC_TAG"
          if [ "$BUMP_OUTCOME" = failure ]; then
            command="python3 tools/contract-gen/contract_gen.py bump --tag $tag"
            cat "$RUNNER_TEMP/hermes-sync-bump.txt" "$RUNNER_TEMP/hermes-sync-bump-err.txt" | tail -n 100 | python3 -c 'import sys; sys.stdout.write(sys.stdin.read()[-50000:])' > "$RUNNER_TEMP/hermes-sync-tail.txt"
          else
            command='cargo test --workspace'
            tail -n 100 "$RUNNER_TEMP/hermes-sync-test.txt" | python3 -c 'import sys; sys.stdout.write(sys.stdin.read()[-50000:])' > "$RUNNER_TEMP/hermes-sync-tail.txt"
          fi
          {
            printf '%s\n```\n' "$command"
            cat "$RUNNER_TEMP/hermes-sync-tail.txt"
            printf '\n```\n'
          } > "$RUNNER_TEMP/hermes-sync-failure.txt"
          issues="$(gh issue list --state open --search "in:title \"Hermes $tag\"" --limit 100 --json title,number)"
          num="$(printf '%s' "$issues" | python3 -c 'import json,sys; title="Hermes " + sys.argv[1] + " needs a manual sync"; print(next((i["number"] for i in json.load(sys.stdin) if i["title"] == title), ""))' "$tag")"
          if [ -n "$num" ]; then
            gh issue edit "$num" --body-file "$RUNNER_TEMP/hermes-sync-failure.txt"
          else
            gh issue create --title "Hermes $tag needs a manual sync" --body-file "$RUNNER_TEMP/hermes-sync-failure.txt"
          fi

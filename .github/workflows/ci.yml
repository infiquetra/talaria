name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.workflow_ref }}-${{
      github.event_name == 'pull_request' && github.event.pull_request.number > 0 &&
      github.workflow != '' && github.workflow_ref != '' && github.ref != '' &&
      format('pr-{0}', github.event.pull_request.number) ||
      format('run-{0}-{1}', github.run_id, github.run_attempt) }}
  cancel-in-progress: >-
    ${{ github.event_name == 'pull_request' && github.event.pull_request.number > 0 &&
        github.workflow != '' && github.workflow_ref != '' && github.ref != '' }}

jobs:
  # Job names are load-bearing: the required status checks on main name them exactly.
  # The matrix holds only `os`. Adding a matrix key would change the reported names and
  # silently detach branch protection from them.
  rust-check:
    name: rust-check (${{ matrix.os }})
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-latest]
    runs-on: ${{ matrix.os == 'macos-14' && 'macos-15' || matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # Full history, so the whitespace check can compare this change with origin/main.
          fetch-depth: 0
      # A pull request that changes only documents no check reads skips the Rust steps.
      # The job still runs and reports under its required name. Any doubt runs everything:
      # the steps below run unless this one answered `true`.
      - name: Classify the change
        id: scope
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: sh tools/ci/change-scope.sh "origin/$BASE_REF" >> "$GITHUB_OUTPUT"
      - name: Install the pinned toolchain
        if: steps.scope.outputs.docs_only != 'true'
        run: |
          rustup toolchain install
          rustup show active-toolchain
      - name: Install cargo-nextest
        if: steps.scope.outputs.docs_only != 'true'
        uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-nextest@0.9.146
      - name: Install cargo-llvm-cov
        if: steps.scope.outputs.docs_only != 'true' && matrix.os == 'ubuntu-latest'
        uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-llvm-cov
      - name: Cache policy checks
        if: steps.scope.outputs.docs_only != 'true' && matrix.os == 'ubuntu-latest'
        run: python3 -I -m unittest discover -s .github/actions/rust-cache -p 'test_*.py'
      - name: Restore disposable Rust caches
        if: steps.scope.outputs.docs_only != 'true'
        continue-on-error: true
        uses: ./.github/actions/rust-cache
        with:
          role: native-debug
      - name: Restore coverage Rust caches
        if: steps.scope.outputs.docs_only != 'true' && matrix.os == 'ubuntu-latest'
        continue-on-error: true
        uses: ./.github/actions/rust-cache
        with:
          role: coverage-debug
      - name: Format
        if: steps.scope.outputs.docs_only != 'true'
        run: cargo fmt --check
      - name: Clippy
        if: steps.scope.outputs.docs_only != 'true'
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        if: steps.scope.outputs.docs_only != 'true' && matrix.os != 'ubuntu-latest'
        run: cargo nextest run --workspace
      # cargo-nextest does not run doctests; this keeps them running on macOS.
      - name: Test workspace doctests
        if: steps.scope.outputs.docs_only != 'true' && matrix.os != 'ubuntu-latest'
        run: cargo test --workspace --doc
      - name: Check the native Linux keystroke budget
        if: steps.scope.outputs.docs_only != 'true' && matrix.os == 'ubuntu-latest'
        run: |
          set -euo pipefail
          cargo test -p talaria-app --test review_timing -- --exact keystroke_budget_while_gh_sleeps --list \
            | grep -Fx 'keystroke_budget_while_gh_sleeps: test'
          cargo test -p talaria-app --test review_timing -- --exact keystroke_budget_while_gh_sleeps --include-ignored
      - name: Test native Linux workspace doctests
        if: steps.scope.outputs.docs_only != 'true' && matrix.os == 'ubuntu-latest'
        run: |
          set -euo pipefail
          list_file="$RUNNER_TEMP/workspace-doctests.list"
          result_file="$RUNNER_TEMP/workspace-doctests.log"
          cargo test --workspace --doc -- --list | tee "$list_file"
          grep -E ': test$' "$list_file" > /dev/null
          cargo test --workspace --doc | tee "$result_file"
          python3 - "$list_file" "$result_file" <<'PY'
          import re
          import sys
          from pathlib import Path

          listed = sum(line.endswith(": test") for line in Path(sys.argv[1]).read_text().splitlines())
          output = Path(sys.argv[2]).read_text()
          summaries = re.findall(
              r"^test result: ok\. (\d+) passed; 0 failed; (\d+) ignored; "
              r"0 measured; 0 filtered out; finished in .+$", output, re.MULTILINE,
          )
          passed = sum(int(row[0]) for row in summaries)
          ignored = sum(int(row[1]) for row in summaries)
          if (not summaries or len(summaries) != len(re.findall(r"^test result:", output, re.MULTILINE))
                  or passed == 0 or passed + ignored != listed):
              sys.exit("Missing, empty or incomplete native workspace doctest results")
          print(f"Native workspace doctests: {listed} listed, {passed} passed, {ignored} ignored")
          PY
      # The restored cache holds only target/llvm-cov-target/debug. Cargo refuses to clean a
      # target directory that lacks its marker file, and the coverage run then reports on
      # test binaries left over from an older commit.
      - name: Mark the coverage directory as a Cargo target
        if: steps.scope.outputs.docs_only != 'true' && matrix.os == 'ubuntu-latest'
        run: |
          mkdir -p target/llvm-cov-target
          test -f target/llvm-cov-target/CACHEDIR.TAG ||
            printf 'Signature: 8a477f597d28d172789f06886806bc55\n' > target/llvm-cov-target/CACHEDIR.TAG
      - name: Measure line coverage (floor 80%)
        if: steps.scope.outputs.docs_only != 'true' && matrix.os == 'ubuntu-latest'
        run: cargo llvm-cov nextest --workspace --ignore-filename-regex /generated/ --fail-under-lines 80
      - name: Clippy ban canary
        if: steps.scope.outputs.docs_only != 'true'
        run: cargo test -p patterns-check --test boundaries -- --ignored clippy_catches_each_banned_interface
      - name: Whitespace
        run: git diff --check origin/main...HEAD
      - name: Conflict markers
        run: |
          ! git grep -nE '^(<{7}|={7}|>{7})( |$)' -- . || (echo "conflict marker" && false)
      - name: Document scan
        if: matrix.os == 'ubuntu-latest'
        run: sh tools/release/doc-scan.sh
      - name: Package tests
        if: steps.scope.outputs.docs_only != 'true'
        run: python3 -I -m unittest discover -s tools/package/tests -t tools/package
      # The report is its own step so it still runs when the floor fails; in one step the
      # shell would stop at the failing floor and never write lcov.info.
      - name: Write the LCOV report
        if: always() && steps.scope.outputs.docs_only != 'true' && matrix.os == 'ubuntu-latest'
        run: cargo llvm-cov report --lcov --output-path lcov.info
      - name: Keep the report
        if: always() && steps.scope.outputs.docs_only != 'true' && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lcov
          path: lcov.info
          if-no-files-found: error

  rust-coverage:
    # Preserve this status while the required matrix owns tests, floor and report failures.
    name: rust-coverage
    timeout-minutes: 90
    runs-on: ubuntu-latest
    needs: rust-check
    if: always()
    steps:
      - name: Require successful workspace validation and coverage
        env:
          RUST_CHECK_RESULT: ${{ needs.rust-check.result }}
        run: test "$RUST_CHECK_RESULT" = success

name: Bench
on:
  pull_request:
  workflow_dispatch:
    inputs:
      runner:
        description: Runner image
        type: choice
        options: [ubuntu-latest, macos-14]
        default: ubuntu-latest
permissions:
  contents: read
jobs:
  bench:
    name: bench
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install the pinned toolchain
        run: |
          rustup toolchain install
          rustup show active-toolchain
      - name: Restore disposable Rust caches
        continue-on-error: true
        uses: ./.github/actions/rust-cache
        with:
          role: bench-release
      - name: Build the binaries
        run: cargo build --release -p talaria-cli -p talaria-bench
      - name: Measure
        run: >
          target/release/talaria-bench run
          --binary target/release/talaria
          --report bench-report.json
      - name: Transcript pager budgets
        run: cargo bench -p talaria-tui --bench pager
      - name: Session picker budgets
        run: cargo bench -p talaria-tui --bench session_picker
      - name: Fleet view budgets
        run: cargo bench -p talaria-tui --bench fleet_view
      - name: Background output and overlay budgets
        run: |
          cargo bench -p talaria-core --bench background_output
          cargo bench -p talaria-tui --bench background_overlay
      - name: Fleet registry budget
        run: |
          cargo bench -p talaria-core --bench fleet_registry
          jq -e '.median.point_estimate < 1000000' target/criterion/fleet_update_200/new/estimates.json
      - name: Subagent tree budgets
        run: cargo bench -p talaria-core --bench subagent_tree
      - name: Subagent panel budget
        run: cargo bench -p talaria-tui --bench subagent_panel
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-report
          path: bench-report.json

name: Bench
on:
  pull_request:
  workflow_dispatch:
    inputs:
      runner:
        description: Runner image
        type: choice
        options: [ubuntu-latest, macos-14]
        default: ubuntu-latest
permissions:
  contents: read

concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.workflow_ref }}-${{
      github.event_name == 'pull_request' && github.event.pull_request.number > 0 &&
      github.workflow != '' && github.workflow_ref != '' && github.ref != '' &&
      format('pr-{0}', github.event.pull_request.number) ||
      format('run-{0}-{1}', github.run_id, github.run_attempt) }}
  cancel-in-progress: >-
    ${{ github.event_name == 'pull_request' && github.event.pull_request.number > 0 &&
        github.workflow != '' && github.workflow_ref != '' && github.ref != '' }}

jobs:
  bench:
    name: bench
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # Full history, so the change can be compared with its base branch.
          fetch-depth: 0
      # A pull request that changes only documents no check reads skips the measurements.
      # The job still runs and reports under its name. Any doubt runs everything.
      - name: Classify the change
        id: scope
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: sh tools/ci/change-scope.sh "origin/$BASE_REF" >> "$GITHUB_OUTPUT"
      - name: Install the pinned toolchain
        if: steps.scope.outputs.docs_only != 'true'
        run: |
          rustup toolchain install
          rustup show active-toolchain
      - name: Restore disposable Rust caches
        if: steps.scope.outputs.docs_only != 'true'
        continue-on-error: true
        uses: ./.github/actions/rust-cache
        with:
          role: bench-release
      - name: Build the binaries
        if: steps.scope.outputs.docs_only != 'true'
        run: cargo build --release -p talaria-cli -p talaria-bench
      - name: Measure
        if: steps.scope.outputs.docs_only != 'true'
        run: >
          target/release/talaria-bench run
          --binary target/release/talaria
          --report bench-report.json
      - name: Transcript pager budgets
        if: steps.scope.outputs.docs_only != 'true'
        run: cargo bench -p talaria-tui --bench pager
      - name: Session picker budgets
        if: steps.scope.outputs.docs_only != 'true'
        run: cargo bench -p talaria-tui --bench session_picker
      - name: Fleet view budgets
        if: steps.scope.outputs.docs_only != 'true'
        run: cargo bench -p talaria-tui --bench fleet_view
      - name: Background output and overlay budgets
        if: steps.scope.outputs.docs_only != 'true'
        run: |
          cargo bench -p talaria-core --bench background_output
          cargo bench -p talaria-tui --bench background_overlay
      - name: Fleet registry budget
        if: steps.scope.outputs.docs_only != 'true'
        run: |
          cargo bench -p talaria-core --bench fleet_registry
          jq -e '.median.point_estimate < 1000000' target/criterion/fleet_update_200/new/estimates.json
      - name: Subagent tree budgets
        if: steps.scope.outputs.docs_only != 'true'
        run: cargo bench -p talaria-core --bench subagent_tree
      - name: Subagent panel budget
        if: steps.scope.outputs.docs_only != 'true'
        run: cargo bench -p talaria-tui --bench subagent_panel
      - name: Keep the report
        if: always() && steps.scope.outputs.docs_only != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-report
          path: bench-report.json

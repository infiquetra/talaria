name: Validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run checks
        run: npm run check
      - name: Check whitespace
        run: git diff --check

  # Talaria's actual check pipeline (ADR-0004). PC7's supported matrix is
  # macOS arm64, so this job carries no continue-on-error: a failure here
  # fails the workflow run.
  #
  # Failing the run is NOT the same as blocking a merge. That is a
  # repository-settings change which cannot be expressed in this file, and it
  # has since been made: `main` requires `python-check (3.12)` and
  # `python-check (3.13)`, with administrator enforcement on. Job names are
  # therefore load-bearing — renaming this job, or letting a matrix key into
  # its name, silently detaches the protection rule from the check it names.
  python-check:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    runs-on: macos-14
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # The KTD6/R28 equivalence harness runs the *real* TypeScript reference
      # recorder through a tsx subprocess. Without Node the whole harness
      # skipped, and a skip is invisible inside a green "353 passed" -- so the
      # test whose own skip message calls it "the CI-standing evidence" for the
      # parity claim had never once run in CI. It is installed here, on the leg
      # that fails the run, rather than on the informational Linux leg.
      - name: Set up Node.js (TypeScript equivalence bridge)
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
      - name: Install the equivalence bridge
        run: npm ci
      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --locked --all-groups
      - name: Ruff
        run: uv run ruff check .
      - name: mypy --strict
        run: uv run mypy
      - name: pytest
        # Turns a missing bridge into a failure on this leg instead of a skip,
        # so the parity proof cannot quietly stop running again.
        env:
          TALARIA_REQUIRE_TS_BRIDGE: "1"
        run: uv run pytest
      - name: bandit
        run: |
          # Application code retains the strict low-severity credential checks.
          uv run bandit -r talaria -q
          # Harness utilities keep script coverage while excluding known low-severity fixture noise.
          uv run bandit -r scripts -q -ll

  # AE10 / R39: the client installs into a clean environment and runs there.
  #
  # Deliberately *not* a step inside python-check. That job installs the
  # development environment with `uv sync --all-groups` and runs everything
  # through `uv run`, so a `talaria` that only works from inside the project
  # venv would pass it. This job never runs `uv sync` and never uses `uv run`:
  # it installs the built wheel as a tool, into directories created for this
  # run, and then invokes the console script by absolute path with a scrubbed
  # environment.
  #
  # The matrix recorded in docs/analysis/2026-08-02-v0-1-daily-driver-verdict.md
  # lists exactly the combinations this job and python-check exercise, and
  # nothing broader.
  install:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    runs-on: macos-14
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install talaria as a tool, into a clean prefix
        env:
          UV_TOOL_DIR: ${{ runner.temp }}/tool-dir
          UV_TOOL_BIN_DIR: ${{ runner.temp }}/tool-bin
        run: uv tool install .
      - name: Run the installed console script with a scrubbed environment
        env:
          UV_TOOL_BIN_DIR: ${{ runner.temp }}/tool-bin
        # `env -i` rather than the job's environment: the point of AE10 is that
        # the installed client works on a machine that is not this checkout.
        # HERMES_DASHBOARD_SESSION_TOKEN is not set here and must never be —
        # `--help` dials nothing, and a credential in this job's environment
        # would be a credential in the runner's process surface (R1).
        run: |
          env -i PATH=/usr/bin:/bin HOME="$RUNNER_TEMP/fake-home" \
            "$UV_TOOL_BIN_DIR/talaria" --help
      - name: The installed build reports the version the source declares
        # The point of the dynamic version is that the distribution metadata
        # and the runtime string come from one literal. This is where that is
        # actually observed: a real built-and-installed artifact, asked what it
        # is, compared against the file hatchling read to build it. A repo-only
        # test cannot see the built metadata, so it cannot make this claim.
        env:
          UV_TOOL_BIN_DIR: ${{ runner.temp }}/tool-bin
        run: |
          expected="$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' talaria/__init__.py)"
          # Without this, a sed that matched nothing would compare the installed
          # output against the string "talaria " and a broken build would pass.
          test -n "$expected"
          actual="$(env -i PATH=/usr/bin:/bin HOME="$RUNNER_TEMP/fake-home" \
            "$UV_TOOL_BIN_DIR/talaria" --version)"
          test "$actual" = "talaria $expected"
      - name: The install wrote nothing outside its own prefix
        # Specifically: nothing into a Hermes installation. Talaria is a
        # standalone client (ADR-0001) and installing it must not touch the
        # thing it connects to. There is no Hermes on the runner, so this
        # asserts the weaker, checkable form — the tool prefix is where the
        # executable landed, and the repository is unchanged.
        env:
          UV_TOOL_BIN_DIR: ${{ runner.temp }}/tool-bin
        run: |
          test -x "$UV_TOOL_BIN_DIR/talaria"
          git diff --exit-code
          test -z "$(git status --porcelain)"

  # Informational until the platform matrix is formally widened: a failure
  # here does not fail the run. It does emit a warning annotation, so an
  # informational failure stays visibly distinct from a pass instead of
  # disappearing into a green run.
  python-check-linux:
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --locked --all-groups
      - name: Ruff
        run: uv run ruff check .
      - name: mypy --strict
        run: uv run mypy
      - name: pytest
        run: uv run pytest
      - name: bandit
        run: |
          # Application code retains the strict low-severity credential checks.
          uv run bandit -r talaria -q
          # Harness utilities keep script coverage while excluding known low-severity fixture noise.
          uv run bandit -r scripts -q -ll
      - name: Flag the informational failure
        if: failure()
        run: |
          MSG="Python ${{ matrix.python-version }} on ubuntu-latest failed."
          MSG="$MSG This does not fail the run (Linux is outside PC7's supported"
          MSG="$MSG matrix) but it is a real failure, not a skip."
          echo "::warning title=Linux leg failed (informational)::$MSG"

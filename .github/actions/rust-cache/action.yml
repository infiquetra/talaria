name: Disposable Rust caches
description: Restore Cargo downloads and isolated build objects; all work still runs
inputs:
  role:
    description: Compilation role and mode
    required: true
runs:
  using: composite
  steps:
    - name: Identify cache inputs and save authority
      id: plan
      shell: bash
      env:
        CACHE_ROLE: ${{ inputs.role }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      run: python3 -I "$GITHUB_ACTION_PATH/cache.py" "$CACHE_ROLE"

    # Only successful default-branch push/schedule/dispatch jobs publish shared downloads.
    # PRs restore only. Do not add broad restore prefixes or cache installed tool binaries.
    - name: Cargo downloads (trusted writer)
      if: steps.plan.outputs.save-downloads == 'true'
      continue-on-error: true
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        key: ${{ steps.plan.outputs.download-key }}
        path: |
          ${{ steps.plan.outputs.cargo-home }}/registry/index
          ${{ steps.plan.outputs.cargo-home }}/registry/cache
          ${{ steps.plan.outputs.cargo-home }}/registry/src
          ${{ steps.plan.outputs.cargo-home }}/git/db
    - name: Cargo downloads (reader)
      if: steps.plan.outputs.save-downloads != 'true'
      continue-on-error: true
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        key: ${{ steps.plan.outputs.download-key }}
        path: |
          ${{ steps.plan.outputs.cargo-home }}/registry/index
          ${{ steps.plan.outputs.cargo-home }}/registry/cache
          ${{ steps.plan.outputs.cargo-home }}/registry/src
          ${{ steps.plan.outputs.cargo-home }}/git/db

    # Build roles never share keys, including native, instrumented, benchmark and release.
    # Release tag pushes may save their own tag scope; only main's caches cross refs.
    # Keep runtime coverage profiles, benchmark measurements and reports out of these paths.
    - name: Build objects (trusted writer)
      if: steps.plan.outputs.build-path != '' && steps.plan.outputs.save-build == 'true'
      continue-on-error: true
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        key: ${{ steps.plan.outputs.build-key }}
        path: ${{ steps.plan.outputs.build-path }}
    - name: Build objects (reader)
      if: steps.plan.outputs.build-path != '' && steps.plan.outputs.save-build != 'true'
      continue-on-error: true
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        key: ${{ steps.plan.outputs.build-key }}
        path: ${{ steps.plan.outputs.build-path }}
